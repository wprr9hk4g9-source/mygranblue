<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>My グラブル</title>
<style>
:root{--bg:#07152f;--panel:#0e2143;--panel2:#122b53;--line:#3f6796;--gold:#e9c46a;--text:#eef5ff;--muted:#a9bdd8;--accent:#4db8ff;--good:#71d49b;--danger:#ff8c8c}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:var(--text);background:radial-gradient(circle at 50% -10%,#204d82 0,#0a1c3b 35%,#050d20 100%);min-height:100vh}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{max-width:1100px;margin:auto;min-height:100vh;padding-bottom:76px}
header{position:sticky;top:0;z-index:10;background:rgba(5,15,35,.94);backdrop-filter:blur(12px);border-bottom:1px solid #34577e;padding:12px 14px}
.brand{display:flex;align-items:center;justify-content:space-between}.brand h1{font-family:serif;margin:0;font-size:24px;letter-spacing:.08em;text-shadow:0 2px 8px #000}.brand small{color:var(--gold)}
nav{display:flex;gap:7px;overflow:auto;padding-top:10px}nav button{white-space:nowrap;color:var(--muted);background:#0b1b38;border:1px solid #2f527c;border-radius:10px;padding:8px 11px}nav button.active{color:#fff;border-color:var(--gold);box-shadow:0 0 10px #d5aa3c33}
main{padding:16px}.hero{border:1px solid #5276a0;border-radius:18px;padding:18px;background:linear-gradient(135deg,#14345d,#091b39);box-shadow:0 12px 30px #0005}.hero h2{margin:0 0 5px;font-family:serif}.hero p{margin:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.card{background:linear-gradient(145deg,#112a50,#0a1d3a);border:1px solid #355b86;border-radius:14px;padding:14px;box-shadow:0 6px 18px #0004}.stat{font-size:25px;font-weight:800}.muted{color:var(--muted);font-size:13px}.gold{color:var(--gold)}
.progress{height:9px;background:#061127;border-radius:99px;overflow:hidden;margin-top:8px;border:1px solid #29486d}.progress i{display:block;height:100%;background:linear-gradient(90deg,#2f9ce9,#e9c46a);width:0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.toolbar input,.toolbar select,.toolbar button,.field input,.field select,.field textarea{background:#081a36;color:var(--text);border:1px solid #385d88;border-radius:10px;padding:9px}.toolbar input{flex:1;min-width:150px}
.section-title{font-family:serif;font-size:22px;margin:20px 0 8px}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.item{position:relative}.item h3{margin:0 0 5px}.badge{display:inline-block;font-size:11px;padding:3px 7px;border-radius:99px;border:1px solid #547aa7;margin-right:4px;color:#dcecff}.badge.good{border-color:#5bc58a;color:#8df0b3}.badge.gold{border-color:#b99642}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed #456585;border-radius:14px}
.form{display:grid;gap:10px}.field{display:grid;gap:5px}.field label{font-size:12px;color:var(--muted)}textarea{min-height:90px;resize:vertical}
.primary{background:linear-gradient(#d8b45e,#98742b);border:1px solid #f0d58a;color:#15100a;font-weight:800;border-radius:10px;padding:10px 14px}
.secondary{background:#102b50;border:1px solid #4b6f98;color:#fff;border-radius:10px;padding:10px 14px}
.row{display:flex;gap:8px;flex-wrap:wrap}.danger{color:#ffaaa8;border-color:#a55b5b!important}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(5,14,32,.96);border-top:1px solid #34577e;display:flex;justify-content:center}.bottom-inner{width:min(1100px,100%);display:flex;justify-content:space-around;padding:8px}.bottom button{background:none;border:0;color:var(--muted);font-size:11px}.bottom button b{display:block;font-size:20px}.bottom button.active{color:#fff}
.modal{position:fixed;inset:0;background:#0009;z-index:50;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{width:100%;max-width:700px;margin:auto;background:#0b1e3d;border:1px solid #53759d;border-radius:20px 20px 0 0;padding:18px;max-height:88vh;overflow:auto}.close{float:right;background:none;border:0;color:#fff;font-size:24px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.list{grid-template-columns:repeat(3,1fr)}.modal{align-items:center}.sheet{border-radius:18px}}

/* Character encyclopedia */
.char-filters{display:grid;gap:9px;margin:14px 0}.filter-label{font-size:12px;color:var(--muted);margin-bottom:2px}.filter-row{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px}.filter-btn{white-space:nowrap;background:#081a36;color:#cfe2f7;border:1px solid #385d88;border-radius:999px;padding:8px 12px}.filter-btn.active{color:#07152f;background:var(--gold);border-color:#f0d58a;font-weight:800}.char-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.char-card{padding:0;overflow:hidden;cursor:pointer}.char-img{height:190px;background:radial-gradient(circle at 50% 20%,#244d7c,#091a35 70%);display:flex;align-items:flex-end;justify-content:center;position:relative;overflow:hidden;border-bottom:1px solid #355b86}.char-img img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}.char-placeholder{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;color:#8fa8c4;font-size:12px;padding:20px}.char-ribbon{position:absolute;left:8px;top:8px;background:#061329d9;border:1px solid #547aa7;border-radius:8px;padding:4px 7px;font-size:11px}.char-owned{position:absolute;right:8px;top:8px;background:#153e2ad9;border:1px solid #5bc58a;color:#a7f2c1;border-radius:8px;padding:4px 7px;font-size:11px}.char-info{padding:11px}.char-info h3{margin:0 0 7px;font-size:16px}.char-info .muted{margin-top:7px}.char-progress{height:6px;margin-top:8px}.char-link{font-size:11px;color:#8fd3ff;text-decoration:none}.char-link:hover{text-decoration:underline}
@media(min-width:700px){.char-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.char-img{height:230px}}
</style>
</head>

  {id:2,text:"武器編成の目標を登録する",done:false},
  {id:3,text:"十天衆・十賢者の進捗を確認する",done:false}
 ],quests:[
  {id:1,name:"十天衆の加入",condition:"対応する天星器を強化し、必要素材を集める",reward:"十天衆キャラクター",done:false},
  {id:2,name:"十賢者の加入",condition:"対応するアーカルム召喚石を強化し、必要素材を集める",reward:"十賢者キャラクター",done:false},
  {id:3,name:"終末の神器の強化",condition:"対象マルチバトル・素材を確認",reward:"終末の神器の強化",done:false},
  {id:4,name:"アーカルム召喚石の作成",condition:"探索で素材・アーカルムポイントを集める",reward:"アーカルム召喚石",done:false}
 ],arcarum:{賢者:0,石:0,礎:0,ide:0,astra:0,玉髄:0}
};
let page="home";
const navs=[["home","🏠","HOME"],["chars","👤","キャラ図鑑"],["weapons","⚔️","武器図鑑"],["summons","💎","召喚石"],["quests","📜","クエスト"],["todos","☑️","TODO"],["arcarum","🃏","アーカルム"],["stats","📊","進捗"]];
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function nav(){document.getElementById("nav").innerHTML=navs.map(n=>`<button class="${page===n[0]?'active':''}" onclick="go('${n[0]}')">${n[1]} ${n[2]}</button>`).join("");document.getElementById("bottom").innerHTML=navs.slice(0,5).map(n=>`<button class="${page===n[0]?'active':''}" onclick="go('${n[0]}')"><b>${n[1]}</b>${n[2]}</button>`).join("")}
function go(p){page=p;render();scrollTo(0,0)}
function render(){nav();let el=document.getElementById("main");({home,chars,weapons,summons,quests,todos,arcarum,stats}[page])(el)}
function home(el){
 const c=state.chars.filter(x=>x.owned).length, ct=state.chars.length, w=state.weapons.length, s=state.summons.filter(x=>x.owned).length;
 const todo=state.todos.filter(x=>!x.done).length;
 el.innerHTML=`<section class="hero"><small class="gold">PERSONAL GRANBLUE DATABASE</small><h2>騎空士の記録帳</h2><p>代表データを収録した管理帳。所持状況をチェックして、自分の図鑑に育てよう。</p></section>
 <div class="grid">
 ${statCard("👤","キャラ所持",`${c} / ${ct}`,ct?c/ct*100:0)}
 ${statCard("⚔️","武器登録",`${w} 件`,0)}
 ${statCard("💎","召喚石所持",`${s} / ${state.summons.length}`,state.summons.length?s/state.summons.length*100:0)}
 ${statCard("☑️","未完了TODO",`${todo} 件`,0)}
 </div>
 <h2 class="section-title">今日のTODO</h2>${todoList(true)}
 <h2 class="section-title">ショートカット</h2><div class="grid">${navs.slice(1,5).map(n=>`<button class="card" onclick="go('${n[0]}')">${n[1]} ${n[2]}<div class="muted">管理ページを開く →</div></button>`).join("")}</div>`;
}
function statCard(i,t,v,p){return `<div class="card"><div>${i} ${t}</div><div class="stat">${v}</div>${p?`<div class="progress"><i style="width:${Math.min(100,p)}%"></i></div><div class="muted">${Math.round(p)}%</div>`:""}</div>`}
const charImageIds={
  "アビー":"3040284000_01.png","カタリナ":"3030005000_01.png","アニラ":"3040027000_01.png","アンチラ":"3040071000_01.png",
  "マキラ":"3040107000_01.png","ヴァジラ":"3040147000_01.png","クビラ":"3040197000_01.png","ビカラ":"3040252000_01.png",
  "シャトラ":"3040313000_01.png","シンダラ":"3040377000_01.png","マコラ":"3040441000_03.png","ハイラ":"3040502000_01.png"
};
const charElements=["すべて","🔥 火","💧 水","🌪️ 風","🪨 土","✨ 光","🌑 闇"];
const charRarities=["すべて","SSR","SR","R"];
function charFilterButton(label,active,onclick){return `<button class="filter-btn ${active?'active':''}" onclick="${onclick}">${label}</button>`}
function chars(el){
 let q=window.charQ||"", attr=window.charAttr||"すべて", rarity=window.charRarity||"すべて", owned=window.charOwned||"";
 let arr=state.chars.filter(x=>{const text=(x.name+x.attr+x.rarity+x.weapon).toLowerCase();const a=attr==="すべて"||attr.includes(x.attr);const r=rarity==="すべて"||rarity===x.rarity;const o=owned===""||(owned==="1"&&x.owned)||(owned==="0"&&!x.owned);return a&&r&&o&&text.includes(q.toLowerCase())});
 el.innerHTML=`<h2 class="section-title">👤 キャラ図鑑</h2><p class="muted">属性・レアリティ・所持状況で絞り込み。カードをタップすると育成状況を編集できます。</p><div class="char-filters"><div><div class="filter-label">属性</div><div class="filter-row">${charElements.map(a=>charFilterButton(a,attr===a,`window.charAttr='${a}';chars(document.getElementById('main'))`)).join("")}</div></div><div><div class="filter-label">レアリティ</div><div class="filter-row">${charRarities.map(r=>charFilterButton(r,rarity===r,`window.charRarity='${r}';chars(document.getElementById('main'))`)).join("")}</div></div><div><div class="filter-label">所持状況</div><div class="filter-row">${charFilterButton('すべて',owned==='',`window.charOwned='';chars(document.getElementById('main'))`)}${charFilterButton('✅ 所持',owned==='1',`window.charOwned='1';chars(document.getElementById('main'))`)}${charFilterButton('⬜ 未所持',owned==='0',`window.charOwned='0';chars(document.getElementById('main'))`)}</div></div></div><div class="toolbar"><input placeholder="🔍 キャラ名・属性・武器で検索" value="${esc(q)}" oninput="window.charQ=this.value;chars(document.getElementById('main'))"><button class="secondary" onclick="window.charQ='';window.charAttr='すべて';window.charRarity='すべて';window.charOwned='';chars(document.getElementById('main'))">リセット</button></div><div class="muted" style="margin:4px 0 10px">${arr.length}件表示 / 登録 ${state.chars.length}件</div><div class="char-grid">${arr.map(charCard).join("")||'<div class="empty">条件に一致するキャラがありません。</div>'}</div>`;
}
function charCard(x){const img=charImageIds[x.name];const imageUrl=img?`https://prd-game-a-granbluefantasy.akamaized.net/assets_en/img/sp/assets/npc/zoom/${img}`:"";const assetLink=img?`https://mizagbf.github.io/GBFAL/?id=${img.replace(/_\d+\.png$/,'')}`:"https://mizagbf.github.io/GBFAL/";return `<div class="card char-card" onclick="editChar(${x.id})"><div class="char-img">${imageUrl?`<img src="${imageUrl}" alt="${esc(x.name)}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\"char-placeholder\">画像を読み込めませんでした</div>'">`:`<div class="char-placeholder">🪽<br>${esc(x.name)}<br><small>画像準備中</small></div>`}<span class="char-ribbon">${esc(x.rarity)} / ${esc(x.attr)}</span>${x.owned?'<span class="char-owned">✓ 所持</span>':''}</div><div class="char-info"><h3>${esc(x.name)}</h3><span class="badge">${esc(x.weapon)}</span><span class="badge ${x.owned?'good':''}">${x.owned?'所持':'未所持'}</span><p class="muted">上限 ${x.uncap}　Lv ${x.lv}　LB ${x.lb}</p><div class="progress char-progress"><i style="width:${x.owned?Math.min(100,x.uncap/4*100):0}%"></i></div><a class="char-link" href="${assetLink}" target="_blank" rel="noopener" onclick="event.stopPropagation()">画像ソースを見る ↗</a></div></div>`}
function weapons(el){el.innerHTML=`<h2 class="section-title">⚔️ 武器図鑑</h2><p class="muted">初期データ入り：代表武器30件。武器名・属性・所持数・目標数を自分用に編集できます。</p><div class="toolbar"><input placeholder="武器名を検索" oninput="weaponQ=this.value;weapons(document.getElementById('main'))"><button class="primary" onclick="openWeapon()">＋ 武器登録</button></div><div class="list">${state.weapons.filter(x=>(x.name||"").includes(window.weaponQ||"")).map(x=>`<div class="card item" onclick="openWeapon(${x.id})"><h3>${esc(x.name)}</h3><span class="badge">${x.attr||"属性未設定"}</span><span class="badge">所持 ${x.owned||0}/${x.target||0}</span><p class="muted">上限 ${x.uncap||0}　${x.awake||"覚醒なし"}</p></div>`).join("")||'<div class="empty">武器を登録するとここに表示されます。</div>'}</div>`}
function summons(el){el.innerHTML=`<h2 class="section-title">💎 召喚石図鑑</h2><p class="muted">初期データ入り：代表召喚石26件。未掲載分は追加登録できます。</p><div class="toolbar"><input placeholder="召喚石名を検索" oninput="summonQ=this.value;summons(document.getElementById('main'))"><button class="primary" onclick="openSummon()">＋ 召喚石登録</button></div><div class="list">${state.summons.filter(x=>(x.name||"").includes(window.summonQ||"")).map(x=>`<div class="card item" onclick="openSummon(${x.id})"><h3>${esc(x.name)}</h3><span class="badge">${x.attr||"属性未設定"}</span><span class="badge ${x.owned?'good':''}">${x.owned?'所持':'未所持'}</span><p class="muted">上限 ${x.uncap||0}</p></div>`).join("")||'<div class="empty">召喚石を登録するとここに表示されます。</div>'}</div>`}
function quests(el){el.innerHTML=`<h2 class="section-title">📜 クエスト・解放条件</h2><div class="toolbar"><button class="primary" onclick="openQuest()">＋ クエスト登録</button></div>${state.quests.map(x=>`<div class="card item" onclick="openQuest(${x.id})"><h3>${esc(x.name)}</h3><p>${esc(x.condition||"")}</p><span class="badge">${x.done?'達成':'未達成'}</span><p class="muted">報酬：${esc(x.reward||"—")}</p></div>`).join("")||'<div class="empty">解放条件を登録して、自分用の攻略メモにできます。</div>'}`}
function todoList(short=false){let a=state.todos;return `<div>${a.slice(0,short?5:999).map(x=>`<div class="card" style="margin:8px 0"><label><input type="checkbox" ${x.done?'checked':''} onchange="toggleTodo(${x.id})"> <span style="${x.done?'text-decoration:line-through;color:#789':''}">${esc(x.text)}</span></label></div>`).join("")||'<div class="empty">TODOはありません。</div>'}</div>`}
function todos(el){el.innerHTML=`<h2 class="section-title">☑️ TODO</h2><div class="toolbar"><input id="todoInput" placeholder="やることを入力"><button class="primary" onclick="addTodo()">追加</button></div>${todoList()}`}
function arcarum(el){let a=state.arcarum;el.innerHTML=`<h2 class="section-title">🃏 アーカルム</h2><p class="muted">自分の進捗をざっくり管理できます。</p><div class="grid">${Object.entries(a).map(([k,v])=>`<div class="card"><b>${k}</b><div class="row" style="margin-top:10px"><button class="secondary" onclick="arc('${k}',-1)">−</button><strong style="padding:10px">${v}</strong><button class="secondary" onclick="arc('${k}',1)">＋</button></div></div>`).join("")}</div>`}
function stats(el){let c=state.chars.length,co=state.chars.filter(x=>x.owned).length,s=state.summons.length,so=state.summons.filter(x=>x.owned).length;el.innerHTML=`<h2 class="section-title">📊 全体の進捗</h2><div class="grid">${statCard("👤","キャラ",`${co}/${c}`,c?co/c*100:0)}${statCard("💎","召喚石",`${so}/${s}`,s?so/s*100:0)}${statCard("⚔️","武器",`${state.weapons.length}件`,0)}${statCard("🃏","アーカルム",`${Object.values(state.arcarum).reduce((a,b)=>a+b,0)}進捗`,0)}</div><div class="card" style="margin-top:14px"><h3>💾 データ</h3><p class="muted">このサイトのデータはこの端末のブラウザに保存されます。</p><button class="secondary" onclick="exportData()">バックアップを書き出す</button> <button class="secondary" onclick="importData()">バックアップを読み込む</button><button class="secondary danger" onclick="resetData()">初期データに戻す</button></div>`}
function openAdd(){openModal(`<h2>＋ 登録</h2><div class="grid"><button class="card" onclick="closeModal();editChar()">👤<br>キャラ</button><button class="card" onclick="closeModal();openWeapon()">⚔️<br>武器</button><button class="card" onclick="closeModal();openSummon()">💎<br>召喚石</button><button class="card" onclick="closeModal();openQuest()">📜<br>クエスト</button></div>`)}
function openModal(x){document.getElementById("modalBody").innerHTML=x;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function editChar(id){let x=state.chars.find(a=>a.id===id)||{id:Date.now(),name:"",attr:"火",rarity:"SSR",weapon:"剣",owned:false,uncap:0,lv:1,lb:0,awakening:"",kuon:false,skin:false,memo:""};let isNew=!id;openModal(`<h2>👤 ${isNew?'キャラ登録':'キャラ編集'}</h2><div class="form">
<div class="field"><label>名前</label><input id="f_name" value="${esc(x.name)}"></div><div class="field"><label>属性</label><select id="f_attr">${["火","水","土","風","光","闇"].map(a=>`<option ${a===x.attr?'selected':''}>${a}</option>`).join("")}</select></div><div class="field"><label>レアリティ</label><select id="f_rarity">${["SSR","SR","R"].map(a=>`<option ${a===x.rarity?'selected':''}>${a}</option>`).join("")}</select></div><div class="field"><label>得意武器</label><input id="f_weapon" value="${esc(x.weapon)}"></div>
<div class="row"><label><input type="checkbox" id="f_owned" ${x.owned?'checked':''}> 所持</label><label>上限 <input id="f_uncap" type="number" min="0" max="5" value="${x.uncap}"></label><label>Lv <input id="f_lv" type="number" value="${x.lv}"></label></div><div class="row"><label>LB <input id="f_lb" type="number" value="${x.lb}"></label><label>覚醒 <input id="f_awake" value="${esc(x.awakening)}"></label></div><label><input type="checkbox" id="f_kuon" ${x.kuon?'checked':''}> 久遠</label><label><input type="checkbox" id="f_skin" ${x.skin?'checked':''}> スキン所持</label><div class="field"><label>メモ</label><textarea id="f_memo">${esc(x.memo)}</textarea></div><button class="primary" onclick="saveChar(${x.id},${isNew})">保存</button>${!isNew?`<button class="secondary danger" onclick="deleteChar(${x.id})">削除</button>`:""}</div>`)}
function saveChar(id,isNew){let x={id,name:f("f_name"),attr:f("f_attr"),rarity:f("f_rarity"),weapon:f("f_weapon"),owned:ck("f_owned"),uncap:+f("f_uncap"),lv:+f("f_lv"),lb:+f("f_lb"),awakening:f("f_awake"),kuon:ck("f_kuon"),skin:ck("f_skin"),memo:f("f_memo")};if(isNew)state.chars.push(x);else Object.assign(state.chars.find(a=>a.id===id),x);save();closeModal();render()}
function deleteChar(id){state.chars=state.chars.filter(x=>x.id!==id);save();closeModal();render()}
function f(id){return document.getElementById(id).value}function ck(id){return document.getElementById(id).checked}
function openWeapon(id){let x=state.weapons.find(a=>a.id===id)||{id:Date.now(),name:"",attr:"火",owned:0,target:1,uncap:0,awake:""};openModal(`<h2>⚔️ 武器登録</h2><div class="form"><div class="field"><label>武器名</label><input id="w_name" value="${esc(x.name)}"></div><div class="field"><label>属性</label><input id="w_attr" value="${esc(x.attr)}"></div><div class="row"><label>所持 <input id="w_owned" type="number" value="${x.owned}"></label><label>目標 <input id="w_target" type="number" value="${x.target}"></label><label>上限 <input id="w_uncap" type="number" value="${x.uncap}"></label></div><div class="field"><label>覚醒</label><input id="w_awake" value="${esc(x.awake)}"></div><button class="primary" onclick="saveWeapon(${x.id})">保存</button>${state.weapons.some(a=>a.id===id)?`<button class="secondary danger" onclick="state.weapons=state.weapons.filter(a=>a.id!==${id});save();closeModal();render()">削除</button>`:""}</div>`)}
function saveWeapon(id){let x={id,name:f("w_name"),attr:f("w_attr"),owned:+f("w_owned"),target:+f("w_target"),uncap:+f("w_uncap"),awake:f("w_awake")};let old=state.weapons.find(a=>a.id===id);old?Object.assign(old,x):state.weapons.push(x);save();closeModal();render()}
function openSummon(id){let x=state.summons.find(a=>a.id===id)||{id:Date.now(),name:"",attr:"火",owned:false,uncap:0};openModal(`<h2>💎 召喚石登録</h2><div class="form"><div class="field"><label>召喚石名</label><input id="s_name" value="${esc(x.name)}"></div><div class="field"><label>属性</label><input id="s_attr" value="${esc(x.attr)}"></div><label><input type="checkbox" id="s_owned" ${x.owned?'checked':''}> 所持</label><label>上限 <input id="s_uncap" type="number" value="${x.uncap}"></label><button class="primary" onclick="saveSummon(${x.id})">保存</button></div>`)}
function saveSummon(id){let x={id,name:f("s_name"),attr:f("s_attr"),owned:ck("s_owned"),uncap:+f("s_uncap")};let old=state.summons.find(a=>a.id===id);old?Object.assign(old,x):state.summons.push(x);save();closeModal();render()}
function openQuest(id){let x=state.quests.find(a=>a.id===id)||{id:Date.now(),name:"",condition:"",reward:"",done:false};openModal(`<h2>📜 クエスト登録</h2><div class="form"><div class="field"><label>クエスト名</label><input id="q_name" value="${esc(x.name)}"></div><div class="field"><label>解放条件</label><textarea id="q_condition">${esc(x.condition)}</textarea></div><div class="field"><label>報酬</label><input id="q_reward" value="${esc(x.reward)}"></div><label><input type="checkbox" id="q_done" ${x.done?'checked':''}> 達成</label><button class="primary" onclick="saveQuest(${x.id})">保存</button></div>`)}
function saveQuest(id){let x={id,name:f("q_name"),condition:f("q_condition"),reward:f("q_reward"),done:ck("q_done")};let old=state.quests.find(a=>a.id===id);old?Object.assign(old,x):state.quests.push(x);save();closeModal();render()}
function addTodo(){let v=document.getElementById("todoInput").value.trim();if(!v)return;state.todos.unshift({id:Date.now(),text:v,done:false});save();render()}
function toggleTodo(id){let x=state.todos.find(a=>a.id===id);if(x)x.done=!x.done;save();render()}
function arc(k,d){state.arcarum[k]=Math.max(0,state.arcarum[k]+d);save();render()}
function exportData(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));a.download="my-granblue-backup.json";a.click()}
function importData(){let i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=e=>{let r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();render();alert("バックアップを読み込みました！")}catch{alert("読み込みに失敗しました")}};r.readAsText(e.target.files[0])};i.click()}
function resetData(){if(confirm("本当に初期化しますか？")){localStorage.removeItem(KEY);location.reload()}}
render();
</script>
</body>
</html>
